name: iOS simulator CI (unsigned)

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Verify Apple toolchain
        run: xcodebuild -version
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run core regression tests
        run: dotnet run --project Mozdulj.Tests/Mozdulj.Tests.csproj --configuration Release -- --backup-recovery-only
      - name: Install MAUI iOS workload
        run: dotnet workload install maui
      - name: Compile iOS simulator (no signing)
        run: |
          dotnet build Mozdulj.Maui/Mozdulj.Maui.csproj -f net10.0-ios -c Debug \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:CodesignKey= \
            -p:CodesignProvision=
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Mozdulj-ios-simulator
          path: Mozdulj.Maui/bin/Debug/net10.0-ios/iossimulator-arm64/**/*.app
          if-no-files-found: error
          retention-days: 14
      - name: Ensure no distributable IPA was produced
        shell: bash
        run: |
          if find Mozdulj.Maui/bin -name '*.ipa' -print | grep -q .; then
            echo "::error::Simulator CI must not publish an IPA."
            exit 1
          fi
