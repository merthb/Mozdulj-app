name: Publish Mozdulj beta.4 Release

on:
  workflow_run:
    workflows: ["Build signed Android APK"]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  actions: read

jobs:
  release:
    # Only a trusted, successful master APK build can publish this release.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact signed-build commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify release version
        run: |
          grep -q '<ApplicationDisplayVersion>1.0.0-beta.4</ApplicationDisplayVersion>' Mozdulj.Maui/Mozdulj.Maui.csproj
          grep -q '<ApplicationVersion>36</ApplicationVersion>' Mozdulj.Maui/Mozdulj.Maui.csproj

      - name: Download signed APK from the successful build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          mkdir -p dist
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "Mozdulj-signed-apk-$SOURCE_NUMBER" --dir dist
          apk="$(find dist -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk" || ! -s "$apk" ]]; then
            echo "::error::The signed APK from the verified build was not found"
            exit 1
          fi
          mv "$apk" dist/Mozdulj-v1.0.0-beta.4.apk

      - name: Publish GitHub pre-release once
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v1.0.0-beta.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # One-time correction: beta.4 was originally tagged at an unsigned
            # README/workflow commit. An unsigned commit cannot display GitHub's
            # Verified badge, although its APK was signed correctly.
            # Only reconcile that exact initial tag, using a verified GitHub
            # merge commit produced after a successful master APK build.
            initial_tag_sha="7d7d9f2141322eee4d15004b5f7af7a3a75f19c0"
            current_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0-beta.4" --jq '.object.sha')"
            if [[ "$current_tag_sha" != "$initial_tag_sha" ]]; then
              echo "Release tag has already been updated; preserving its APK."
              exit 0
            fi
            verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SIGNED_SHA" --jq '.commit.verification.verified')"
            if [[ "$verified" != "true" ]]; then
              echo "::error::Refusing to retarget beta.4 to an unsigned commit."
              exit 1
            fi
            # Replace the APK with the signed, successfully checked package
            # built from EXACTLY the same commit as the new verified tag.
            gh release upload v1.0.0-beta.4 dist/Mozdulj-v1.0.0-beta.4.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.0.0-beta.4" \
              -f sha="$SIGNED_SHA" -F force=true >/dev/null
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/443442642" \
              -f target_commitish="$SIGNED_SHA" >/dev/null
            resolved_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0-beta.4" --jq '.object.sha')"
            if [[ "$resolved_sha" != "$SIGNED_SHA" ]]; then
              echo "::error::The release tag did not point to the verified build commit."
              exit 1
            fi
            echo "Release updated to verified signed-build commit $SIGNED_SHA."
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          ## Mozdulj! – Béta verzió 1.0 – 4. javítás

          Android: `1.0.0-beta.4` · verziókód: **36**.

          ### Újdonságok és javítások
          - Világos és grafitszürke sötét téma, mindkettőhöz magas kontrasztú nézet.
          - A témaváltás nem zárja be az alkalmazást; az új megjelenés azonnal érvényesül.
          - Az Android betűméretéhez igazodó kezelőfelület és dinamikusan méretezett gyakorlattári kártyák.
          - Visszaállítás után a hiányzó saját relaxációs zenefájlok kiszűrése és egyértelmű visszajelzés.
          - A zenei források különválasztása, értesítési engedély újraellenőrzése.

          ### Telepítés
          Töltsd le a `Mozdulj-v1.0.0-beta.4.apk` fájlt, és **a meglévő telepítés frissítéseként** nyisd meg a telefonodon. Ne töröld az alkalmazást! Frissítés előtt ajánlott teljes adatmentést készíteni.

          Az APK a GitHub Actions által aláírt, ellenőrzött master-buildből származik. Az emlékeztetők az Android energiatakarékos időzítése miatt néhány percet késhetnek.
          NOTES
          gh release create v1.0.0-beta.4 dist/Mozdulj-v1.0.0-beta.4.apk \
            --repo "$GITHUB_REPOSITORY" --target "$SIGNED_SHA" \
            --title "Béta verzió 1.0 – 4. javítás" --prerelease \
            --notes-file release-notes.md
